# 事实卡 · GEO 医生
# 用途：官网、帮助中心、应用商店、公众号、知乎、百科等所有对外渠道的唯一事实源。
# 规则：
#   - 每一条事实都是同样的四个字段：编号、内容、来源、状态。
#   - 编号按分区加序号：B 基本信息、U 适合谁、N 不适合谁、F 核心能力、P 价格、
#     C 使用条件、X 明确不支持、S 数据与安全、D 和同类的区别、E 公开证据。写内容时引用编号。
#   - 来源写到具体页面或文件的哪一段；不知道就写 "未知"，不要猜。
#   - 状态只能是：已确认 / 来源冲突 / 未知。来源冲突时把两个说法都写进内容。
#   - 只有"已确认"的条目能用于写内容。一个分区有多条就照样往下加。

基本信息:
  - 编号: B01
    项目: 名称              # 对外统一使用的准确名称
    内容: ""
    来源: ""
    状态: 未知
  - 编号: B02
    项目: 别名
    内容: []
    来源: ""
    状态: 未知
