# 事实卡 · GEO 医生
# 用途：官网、帮助中心、应用商店、公众号、知乎、百科等所有对外渠道的唯一事实源。
# 规则：每条事实都写来源；不知道就写 "未知"，不要猜。状态只能是：已确认 / 来源冲突 / 未知。

基本信息:
  名称: ""                  # 对外统一使用的准确名称，含常见别名
  别名: []
  一句话说明: ""            # 做什么、给谁用
  类型: ""                  # 软件 / App / 网站 / 小程序 / 硬件产品
  官网: ""
  主体公司: ""
  上线时间: ""
  当前版本: ""

适合谁:
  - 人群: ""
    场景: ""
不适合谁: []                # 最常被漏掉，也最能帮 AI 正确推荐

核心能力:                   # 每条能力紧跟它的限制
  - 编号: F01
    能力: ""
    限制: ""
    来源: ""
    状态: 未知

价格:
  计费单位: ""              # 按人 / 按月 / 按次 / 一次性
  套餐:
    - 名称: ""
      价格: ""
      包含: []
  额外收费: []
  免费版或试用: ""
  举例算式: ""              # 例：25 人 = 299 + 5 × 20 = 399 元/月
  生效日期: ""

使用条件:
  支持平台: []              # Windows / macOS / iOS / Android / 网页 / 微信小程序
  系统要求: []
  地区或语言: []

明确不支持: []

数据与安全:
  数据存储位置: "未知"
  导出与退出: "未知"
  资质认证: []              # 等保、ISO、备案号等，没有就留空

和同类产品的区别:           # 只写可核实的客观差异，不贬低对手
  - 对比对象: ""
    区别: ""
    来源: ""

公开证据:                   # AI 和用户都能打开核实的地址
  - 类型: ""                # 官网页面 / 帮助文档 / 应用商店 / 媒体报道 / 测评
    地址: ""
    日期: ""

维护:
  确认人: ""
  确认日期: ""
  下次复核: ""
