# 事实卡模板 · GEO 学习地图
# 用途：所有对外渠道（官网、FAQ、商店、地图、公众号、小程序）的唯一数据源。
# 规则：每条事实写来源和确认人；不知道就写 "未知"，不要猜。
# 可用 toolkit/prompts.md 中的 P2 从原始资料自动整理初稿，再人工确认。

基本信息:
  名称: ""                # 对外统一使用的准确名称
  一句话说明: ""          # 做什么、给谁用
  适合谁: []
  不适合谁: []            # 这一项最常被漏掉，也最能帮 AI 正确推荐
  当前版本或状态: ""

价格:
  计费单位: ""            # 按人 / 按团队 / 按次 / 按小时
  标准价格: ""
  包含内容: []
  额外收费: []            # 税费、上门费、超额费用；不确定写 "未知"
  举例算式: ""            # 例：25 人 = 299 + 5 × 20 = 399 元/月
  生效日期: ""

使用条件:
  系统或环境: []          # 软件：系统、芯片、浏览器；门店：营业时间、服务区域
  需要用户准备: []
  预约或开通方式: ""

明确不支持或不包含: []

数据与退出:
  导出或退款或取消: ""
  隐私与数据使用: "未知"

公开证据:
  - 类型: ""              # 截图 / 实拍 / 测试记录 / 案例
    地址: ""
    日期: ""

维护:
  确认人: ""
  确认日期: ""
  下次复核: ""
