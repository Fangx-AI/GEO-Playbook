name: 📚 推荐一条资源
description: 官方文档、研究、论文或高质量教程
labels: ["resource"]
body:
  - type: input
    id: url
    attributes:
      label: 原始链接
      placeholder: https://
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: 作者 / 机构，发布时间
  - type: dropdown
    id: kind
    attributes:
      label: 证据类型
      options:
        - 🟢 平台官方文档
        - 📊 独立研究 / 论文
        - 🟡 实施方或服务商自报案例
        - 其他
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 它能帮读者解决什么具体问题？建议放在哪一章？
    validations:
      required: true
  - type: checkboxes
    id: check
    attributes:
      label: 确认
      options:
        - label: 我读过正文，不只是看了搜索摘要
          required: true
        - label: 我与该资源的作者、品牌或工具没有利益关系（如有请在上面说明）
