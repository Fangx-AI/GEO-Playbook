name: skill-package
# Builds geo-doctor.zip for platforms that install skills by upload (豆包, WorkBuddy, 扣子, TRAE).
# Releases get the zip attached whether they come from a pushed v* tag, the GitHub web UI,
# or a manual run with a tag name: an existing tag is re-packaged, a new one is created
# on the branch the run was started from (so a release can be cut without pushing a tag).
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: [skills/**]
  pull_request:
    paths: [skills/**]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.1 (created on the selected branch if it does not exist)
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.tag
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then git checkout -q "$TAG"
          else echo "Tag $TAG does not exist yet; packaging $GITHUB_REF and creating the release there."; fi
        env:
          TAG: ${{ inputs.tag }}
      - run: mkdir -p dist && cd skills && zip -qr ../dist/geo-doctor.zip geo-doctor
      - uses: actions/upload-artifact@v4
        with:
          name: geo-doctor
          path: dist/geo-doctor.zip
      - if: inputs.tag || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        # Upload to the release if it already exists (web UI, or the other trigger won the race); otherwise create it.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/geo-doctor.zip --clobber
          else
            gh release create "$TAG" dist/geo-doctor.zip --target "$(git rev-parse HEAD)" --title "GEO 医生 $TAG" --generate-notes || gh release upload "$TAG" dist/geo-doctor.zip --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
