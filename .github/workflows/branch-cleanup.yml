name: branch-cleanup
# Deletes a pull request's branch once it is merged. A manual run also deletes leftover
# branches whose pull requests are all closed; branches with an open PR, branches that never
# had a PR from this repository (fork PRs are ignored), and the default branch are kept.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "Branch $BRANCH already gone."
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
      - if: github.event_name == 'workflow_dispatch'
        run: |
          default=$(gh api "repos/$GITHUB_REPOSITORY" -q .default_branch)
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 500 --json headRefName,isCrossRepository -q '.[] | select(.isCrossRepository | not) | .headRefName')
          closed=$(gh pr list -R "$GITHUB_REPOSITORY" --state closed --limit 500 --json headRefName,isCrossRepository -q '.[] | select(.isCrossRepository | not) | .headRefName')
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" -q '.[].name' | while read -r b; do
            [ "$b" = "$default" ] && continue
            printf '%s\n' "$open" | grep -qxF -- "$b" && continue
            printf '%s\n' "$closed" | grep -qxF -- "$b" || continue
            echo "Deleting $b"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b"
          done
        env:
          GH_TOKEN: ${{ github.token }}
